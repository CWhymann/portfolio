<section class="about" id="about">
  <div class="about__container">
    <div class="about__image-wrapper">
      <img class="about__image" src="img/Avatar.jpg" alt="Christian Wiemann" />
      <div class="about__decoration"></div>
    </div>

    <div class="about__content">
      <span class="about__label">{{ translation.translate('about.label') }}</span>
      <div class="about__box">
        <h2 class="about__title">{{ translation.translate('about.title') }}</h2>
        <p class="about__text">{{ translation.translate('about.text') }}</p>
        <ul class="about__highlights">
          <li class="about__highlight">
            <img src="icons/13. About base me .svg" alt="" aria-hidden="true" />
            <span>{{ translation.translate('about.highlight1') }}</span>
          </li>
          <li class="about__highlight">
            <img src="icons/14. About skill me .svg" alt="" aria-hidden="true" />
            <span>{{ translation.translate('about.highlight2') }}</span>
          </li>
          <li class="about__highlight">
            <img src="icons/15. About check me.svg" alt="" aria-hidden="true" />
            <span>{{ translation.translate('about.highlight3') }}</span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</section>
