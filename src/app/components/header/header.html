<header class="header">
  <nav class="header__nav">
    <div class="header__left">
      <div class="header__lang">
        <button
          class="header__lang-btn"
          [class.header__lang-btn--active]="translation.currentLang() === 'en'"
          (click)="setLanguage('en')"
        >
          EN
        </button>
        <button
          class="header__lang-btn"
          [class.header__lang-btn--active]="translation.currentLang() === 'de'"
          (click)="setLanguage('de')"
        >
          DE
        </button>
      </div>
      <a class="header__link" href="#about">{{ translation.translate('header.about') }}</a>
      <a class="header__link" href="#skills">{{ translation.translate('header.skills') }}</a>
      <a class="header__link" href="#projects">{{ translation.translate('header.projects') }}</a>
    </div>

    <a routerLink="/" class="header__logo">
      <img class="header__logo-icon" src="icons/favicon.svg" alt="Logo" />
      <span class="header__logo-text">Christian<br />Wiemann</span>
    </a>

    <button
      class="header__hamburger"
      (click)="toggleMenu()"
      [attr.aria-label]="isMenuOpen() ? 'Menü schließen' : 'Menü öffnen'"
      [attr.aria-expanded]="isMenuOpen()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <div class="header__mobile-menu" [class.header__mobile-menu--open]="isMenuOpen()">
    <a class="header__link" href="#about" (click)="toggleMenu()">{{
      translation.translate('header.about')
    }}</a>
    <a class="header__link" href="#skills" (click)="toggleMenu()">{{
      translation.translate('header.skills')
    }}</a>
    <a class="header__link" href="#projects" (click)="toggleMenu()">{{
      translation.translate('header.projects')
    }}</a>

    <div class="header__lang header__lang--mobile">
      <button
        class="header__lang-btn"
        [class.header__lang-btn--active]="translation.currentLang() === 'en'"
        (click)="setLanguage('en')"
      >
        EN
      </button>
      <button
        class="header__lang-btn"
        [class.header__lang-btn--active]="translation.currentLang() === 'de'"
        (click)="setLanguage('de')"
      >
        DE
      </button>
    </div>
  </div>
</header>
